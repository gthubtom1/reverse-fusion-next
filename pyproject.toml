[project]
name = "reverse-rea-next"
version = "2.0.0.dev0"
description = "Evidence-driven reverse engineering and reconstruction orchestration"
requires-python = ">=3.11"
dependencies = ["Pillow==11.3.0"]
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rea_enhanced*", "reverse_fusion*"]

[project.scripts]
reverse-fusion = "rea_enhanced.cli:main"
rea-enhanced = "rea_enhanced.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests_next"]
